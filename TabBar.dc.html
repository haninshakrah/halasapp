<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;border-top:2px solid var(--color-divider);background:var(--color-bg);padding:0 0 26px;flex-shrink:0;font-family:var(--font-body)">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
    <div onClick="{{ t.onClick }}" style="cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:10px 0 8px 12px;border-top:3px solid {{ t.bar }};margin-top:-2px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{ t.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.d }}"></path></svg>
      <div style="font-size:11px;font-weight:{{ t.weight }};color:{{ t.color }}">{{ t.label }}</div>
    </div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hem&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onTab&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(key: string) => void&quot;},&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:100}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'hem';
    const defs = [
      ['hem', 'Hem', 'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10'],
      ['kalender', 'Kalender', 'M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M16 2v4 M8 2v4 M3 10h18'],
      ['meddelanden', 'Meddelanden', 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'],
      ['aviseringar', 'Aviseringar', 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10.3 21a1.94 1.94 0 0 0 3.4 0'],
      ['personal', 'Personal', 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M13 7a4 4 0 1 1-8 0a4 4 0 0 1 8 0 M22 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75'],
    ];
    return { tabs: defs.map(([k, label, d]) => ({ onClick: () => this.props.onTab && this.props.onTab(k), label, d, bar: k === a ? 'var(--color-accent)' : 'transparent', color: k === a ? 'var(--color-accent-700)' : 'var(--color-neutral-700)', weight: k === a ? 800 : 600 })) };
  }
}

</script>
</body>
</html>
